<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pizarra - Nosotros</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #070a13;
      --card-bg: rgba(19, 27, 46, 0.9);
      --card-border: rgba(255, 255, 255, 0.14);
      --accent: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }
    body {
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 38px) 14px calc(env(safe-area-inset-bottom, 15px) + 72px) 14px;
      position: relative;
    }

    /* Barra Superior */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 34px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .presence-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
    }
    .presence-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* Marco de la Pizarra */
    .board-frame {
      flex: 1;
      width: 100%;
      position: relative;
      background: #090e1a;
      border: 2px solid rgba(244, 63, 94, 0.35);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      display: flex;
    }

    /* Canvas de dibujo táctil */
    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
      z-index: 1;
    }

    /* Barra de Herramientas Flotante */
    .floating-toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .color-palette {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .color-btn.active {
      transform: scale(1.22);
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .tools-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tool-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .tool-btn:active {
      transform: scale(0.92);
    }
    .tool-btn.danger {
      background: rgba(244, 63, 94, 0.18);
      border-color: rgba(244, 63, 94, 0.45);
      color: #fda4af;
    }

    /* Barra Inferior Fija */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom, 5px);
      z-index: 100;
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.75rem;
      text-decoration: none;
      width: 50%;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item span.icon { font-size: 1.35rem; }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <div class="top-bar">
    <div class="presence-badge">
      <div class="presence-dot"></div>
      <span id="user-display">Pizarra Compartida</span>
    </div>
    <span style="font-size: 0.72rem; color: #94a3b8;" id="board-status">Sincronizado</span>
  </div>

  <!-- Pizarra con Barra Flotante Superior -->
  <div class="board-frame">
    
    <!-- Barra de Herramientas Flotante -->
    <div class="floating-toolbar">
      <div class="color-palette">
        <div class="color-btn active" style="background: #f43f5e;" onclick="selectColor('#f43f5e', this)"></div>
        <div class="color-btn" style="background: #38bdf8;" onclick="selectColor('#38bdf8', this)"></div>
        <div class="color-btn" style="background: #facc15;" onclick="selectColor('#facc15', this)"></div>
        <div class="color-btn" style="background: #ffffff;" onclick="selectColor('#ffffff', this)"></div>
      </div>

      <div class="tools-group">
        <button class="tool-btn" id="stroke-btn" onclick="toggleStroke(this)">● 4px</button>
        <button class="tool-btn danger" onclick="clearCanvas(true)">🗑️ Borrar</button>
      </div>
    </div>

    <!-- Lienzo -->
    <canvas id="draw-canvas"></canvas>
  </div>

  <!-- Barra Inferior -->
  <nav class="bottom-nav">
  <a href="index.html" class="nav-item">
    <span class="icon">❤️</span>
    <span>Toque</span>
  </a>
  <a href="pizarra.html" class="nav-item active">
    <span class="icon">🎨</span>
    <span>Pizarra</span>
  </a>
  <a href="perfil.html" class="nav-item">
    <span class="icon">👤</span>
    <span>Perfil</span>
  </a>
</nav>

  <script>
    const SUPABASE_URL = 'https://qxoaavedwbomrhszvgtx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b2FhdmVkd2JvbXJoc3p2Z3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMjY2NDksImV4cCI6MjEwNjcwMjY0OX0.XtQDxQchFLNB4ywhHKHvoR4aqOEyMVmoc1tBeQ1KHR8';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let currentColor = '#f43f5e';
    let currentLineWidth = 4;
    let lastX = 0;
    let lastY = 0;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      if (canvas.width !== rect.width || canvas.height !== rect.height) {
        let temp;
        if (canvas.width > 0 && canvas.height > 0) {
          temp = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }
        canvas.width = rect.width;
        canvas.height = rect.height;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (temp) ctx.putImageData(temp, 0, 0);
      }
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', resizeCanvas);
    setTimeout(resizeCanvas, 60);

    function selectColor(color, elem) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      elem.classList.add('active');
    }

    function toggleStroke(btn) {
      if (currentLineWidth === 4) {
        currentLineWidth = 8;
        btn.innerText = '⬤ 8px';
      } else {
        currentLineWidth = 4;
        btn.innerText = '● 4px';
      }
    }

    // Canal WebSockets Broadcast
    const channel = supabaseClient.channel('whiteboard-live', {
      config: { broadcast: { self: false } }
    });

    channel
      .on('broadcast', { event: 'draw' }, ({ payload }) => {
        const w = canvas.width;
        const h = canvas.height;
        drawStroke(payload.x0 * w, payload.y0 * h, payload.x1 * w, payload.y1 * h, payload.color, payload.width || 4, false);
      })
      .on('broadcast', { event: 'clear' }, () => {
        clearCanvas(false);
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          document.getElementById('board-status').innerText = 'En vivo';
        }
      });

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      isDrawing = true;
      const pos = getPos(e);
      lastX = pos.x;
      lastY = pos.y;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      const pos = getPos(e);
      drawStroke(lastX, lastY, pos.x, pos.y, currentColor, currentLineWidth, true);
      lastX = pos.x;
      lastY = pos.y;
    });

    window.addEventListener('pointerup', () => { isDrawing = false; });
    window.addEventListener('pointercancel', () => { isDrawing = false; });

    function drawStroke(x0, y0, x1, y1, color, width, broadcast = true) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();

      if (broadcast && channel) {
        channel.send({
          type: 'broadcast',
          event: 'draw',
          payload: {
            x0: x0 / canvas.width,
            y0: y0 / canvas.height,
            x1: x1 / canvas.width,
            y1: y1 / canvas.height,
            color,
            width
          }
        });
      }
    }

    function clearCanvas(broadcast = true) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (broadcast && channel) {
        channel.send({ type: 'broadcast', event: 'clear', payload: {} });
      }
    }
  </script>
</body>
</html>
