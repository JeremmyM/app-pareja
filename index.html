<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nosotros</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nosotros">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.45);
      --text: #f8fafc;
      --text-muted: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 40px) 18px calc(env(safe-area-inset-bottom, 20px) + 20px);
      text-align: center;
      overflow-x: hidden;
    }

    /* Modal de configuración inicial si no está definido */
    #setup-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      gap: 20px;
    }
    .setup-btn {
      width: 100%;
      max-width: 280px;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .user-tag {
      font-size: 0.9rem;
      color: #94a3b8;
      font-weight: 500;
    }
    .bell-btn {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .bell-btn.synced {
      background: transparent;
      border-color: rgba(16, 185, 129, 0.3);
      color: #10b981;
    }

    .touch-dashboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }
    .counter-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .counter-badge b { color: var(--accent); }

    .touch-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 30% 30%, #fb7185, #e11d48 85%);
      color: white;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 10px 35px var(--accent-glow);
      transition: transform 0.15s ease;
      margin: 20px 0 10px;
    }
    .touch-btn:active { transform: scale(0.88); }

    .pulse-effect {
      animation: heartShock 0.7s infinite alternate cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes heartShock {
      0% { transform: scale(1); box-shadow: 0 0 20px var(--accent-glow); }
      100% { transform: scale(1.15); box-shadow: 0 0 55px rgba(244, 63, 94, 0.9); }
    }

    #touch-status {
      font-size: 1rem;
      color: #cbd5e1;
      min-height: 28px;
    }

    .touch-types-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      max-width: 100%;
      padding: 4px;
      scrollbar-width: none;
    }
    .touch-types-grid::-webkit-scrollbar { display: none; }
    .type-pill {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .type-pill.active {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--accent);
      color: #fda4af;
    }
  </style>
</head>
<body>

  <!-- Pantalla de asignación inicial de un solo toque -->
  <div id="setup-screen">
    <h2 style="font-size: 1.4rem;">¿De quién es este celular?</h2>
    <p style="color: #94a3b8; font-size: 0.9rem;">Solo se elige una vez.</p>
    <button class="setup-btn" onclick="assignOwner('Jeremmy')">Es el celular de Jeremmy</button>
    <button class="setup-btn" onclick="assignOwner('Verónica')">Es el celular de Verónica</button>
  </div>

  <div class="top-bar">
    <div class="user-tag" id="user-display">Cargando...</div>
    <button class="bell-btn" id="bell-btn" onclick="subscribePush()">🔔 Alertas</button>
  </div>

  <div class="touch-dashboard">
    <div class="counter-badge">
      Toques de hoy: <b id="touch-count">0</b>
    </div>

    <button class="touch-btn" id="main-heart" onclick="sendSignal()">
      <span id="heart-icon" style="font-size: 2.7rem;">❤️</span>
      <span id="heart-label">Pensándote</span>
    </button>

    <p id="touch-status">Toca para enviarle un beso</p>

    <div class="touch-types-grid">
      <button class="type-pill active" onclick="selectType('❤️', 'Pensándote', 'te mandó un beso', this)">
        <span>❤️</span> Beso
      </button>
      <button class="type-pill" onclick="selectType('🫂', 'Abrazo', 'te mandó un abrazo apretado', this)">
        <span>🫂</span> Abrazo
      </button>
      <button class="type-pill" onclick="selectType('✨', 'Cosquillas', 'te anda haciendo cosquillas', this)">
        <span>✨</span> Cosquillas
      </button>
      <button class="type-pill" onclick="selectType('🥺', 'Te extraño', 'te extraña mucho ahora', this)">
        <span>🥺</span> Te extraño
      </button>
    </div>
  </div>

  <div style="font-size: 0.75rem; color: #475569;">Conexión privada y cifrada</div>

  <script>
    const SUPABASE_URL = 'https://qxoaavedwbomrhszvgtx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b2FhdmVkd2JvbXJoc3p2Z3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMjY2NDksImV4cCI6MjEwNjcwMjY0OX0.XtQDxQchFLNB4ywhHKHvoR4aqOEyMVmoc1tBeQ1KHR8';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const VAPID_PUBLIC_KEY = 'BFNX4RqJrx-dwMNcseGOEwxYRXD9fU9B5ASfTIatfy6wpSYWMKZT5L-l1ug5kV6PHkSXuP3c49gC2UiQyK0sfac';

    // 1. Detección automática por URL o LocalStorage
    const urlParams = new URLSearchParams(window.location.search);
    const paramUser = urlParams.get('yo');

    if (paramUser) {
      const formatted = paramUser.toLowerCase() === 'veronica' ? 'Verónica' : 'Jeremmy';
      localStorage.setItem('device_owner', formatted);
    }

    let currentOwner = localStorage.getItem('device_owner');

    if (!currentOwner) {
      document.getElementById('setup-screen').style.display = 'flex';
    } else {
      initApp();
    }

    function assignOwner(name) {
      currentOwner = name;
      localStorage.setItem('device_owner', name);
      document.getElementById('setup-screen').style.display = 'none';
      initApp();
      subscribePush(); // Pedir permiso de inmediato al asignar
    }

    function initApp() {
      const partner = currentOwner === 'Jeremmy' ? 'Verónica' : 'Jeremmy';
      document.getElementById('user-display').innerText = `Tú (${currentOwner}) ❤️ ${partner}`;
      fetchTodayCount();
      checkPushStatus();
    }

    let selectedEmoji = '❤️';
    let selectedLabel = 'Pensándote';
    let selectedActionText = 'te mandó un beso';

    function selectType(emoji, label, actionText, elem) {
      document.querySelectorAll('.type-pill').forEach(p => p.classList.remove('active'));
      elem.classList.add('active');
      selectedEmoji = emoji;
      selectedLabel = label;
      selectedActionText = actionText;
      document.getElementById('heart-icon').innerText = emoji;
      document.getElementById('heart-label').innerText = label;
    }

    // 2. Envío con confirmación real de entrega
    async function sendSignal() {
      const btn = document.getElementById('main-heart');
      const status = document.getElementById('touch-status');
      const partner = currentOwner === 'Jeremmy' ? 'Verónica' : 'Jeremmy';
      
      btn.style.transform = 'scale(0.86)';
      setTimeout(() => btn.style.transform = 'scale(1)', 140);
      if ('vibrate' in navigator) navigator.vibrate(70);

      status.innerText = 'Enviando...';

      // Guardar registro
      await supabaseClient.from('pings').insert([{ sender: currentOwner }]);

      // Llamar a la Edge Function y esperar confirmación real
      try {
        const { data, error } = await supabaseClient.functions.invoke('send-push', {
          body: { 
            record: { 
              sender: currentOwner,
              body: `${currentOwner} ${selectedActionText}`
            } 
          }
        });

        if (error) throw error;

        if (data && data.delivered) {
          status.innerText = `✓ Entregado al celular de ${partner}`;
        } else {
          status.innerText = `⚠ Enviado (pero ${partner} no tiene alertas activas)`;
        }
      } catch (err) {
        status.innerText = '✓ Enviado';
      }

      fetchTodayCount();
      setTimeout(() => status.innerText = `Toca para enviarle un ${selectedLabel.toLowerCase()}`, 3500);
    }

    async function fetchTodayCount() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const { count } = await supabaseClient
        .from('pings')
        .select('*', { count: 'exact', head: true })
        .gte('created_at', today.toISOString());
      if (count !== null) document.getElementById('touch-count').innerText = count;
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    async function subscribePush() {
      if (!('serviceWorker' in navigator)) return;
      const b = document.getElementById('bell-btn');
      b.innerText = 'Activando...';

      try {
        const reg = await navigator.serviceWorker.ready;
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          // Desuscribir token viejo corrupto
          const oldSub = await reg.pushManager.getSubscription();
          if (oldSub) await oldSub.unsubscribe();

          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });

          await supabaseClient.from('push_subscriptions').upsert({
            user_name: currentOwner,
            subscription: sub.toJSON(),
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_name' });

          b.innerText = '✓ Alertas listas';
          b.classList.add('synced');
          alert(`Alertas activadas para ${currentOwner}`);
        } else {
          b.innerText = '🔔 Alertas';
          alert('Permite las notificaciones para avisarte con la app cerrada.');
        }
      } catch (e) {
        b.innerText = '🔔 Alertas';
        alert('Error activando alertas: ' + e.message);
      }
    }

    async function checkPushStatus() {
      if ('Notification' in window && Notification.permission === 'granted') {
        const b = document.getElementById('bell-btn');
        b.innerText = '✓ Alertas listas';
        b.classList.add('synced');
      }
    }

    // Recepción en vivo (primer plano)
    supabaseClient.channel('live-touch-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pings' }, (payload) => {
        if (payload.new.sender !== currentOwner) {
          const btn = document.getElementById('main-heart');
          const status = document.getElementById('touch-status');
          status.innerText = `${payload.new.sender} te acaba de tocar la pantalla.`;
          btn.classList.add('pulse-effect');
          if ('vibrate' in navigator) navigator.vibrate([500, 150, 500, 150, 800]);
          fetchTodayCount();
          setTimeout(() => {
            btn.classList.remove('pulse-effect');
            status.innerText = `Toca para enviarle un ${selectedLabel.toLowerCase()}`;
          }, 4500);
        }
      })
      .subscribe();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => checkPushStatus());
    }
  </script>
</body>
</html>
