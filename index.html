<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nosotros</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nosotros">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #070a13;
      --card-bg: rgba(19, 27, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #f43f5e;
      --accent-soft: rgba(244, 63, 94, 0.15);
      --accent-glow: rgba(244, 63, 94, 0.45);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(244, 63, 94, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 42px) 18px calc(env(safe-area-inset-bottom, 20px) + 75px);
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }

    #particles-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Asignación inicial de dispositivo */
    #setup-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      gap: 20px;
    }
    .setup-btn {
      width: 100%;
      max-width: 290px;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* Barra Superior */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      z-index: 10;
      margin-bottom: 12px;
    }
    .presence-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      font-size: 0.8rem;
    }
    .presence-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fda4af;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .bell-btn {
      background: var(--accent-soft);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .bell-btn.synced {
      background: transparent;
      border-color: rgba(16, 185, 129, 0.3);
      color: #10b981;
    }

    /* Paneles de Vistas */
    .tab-panel {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 5;
    }
    .tab-panel.active {
      display: flex;
    }

    /* SECCIÓN 1: TOQUE */
    .sync-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(12px);
    }
    .sync-metric {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .sync-metric span.label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .sync-metric span.value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
    }

    .heart-container {
      position: relative;
      width: 210px;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    .pulse-ring {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 2px solid rgba(244, 63, 94, 0.25);
      animation: ripple 3s infinite cubic-bezier(0.1, 0.2, 0.4, 1);
    }
    @keyframes ripple {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    .charge-svg {
      position: absolute;
      width: 200px;
      height: 200px;
      transform: rotate(-90deg);
      pointer-events: none;
    }
    .charge-circle {
      stroke: var(--accent);
      stroke-width: 4;
      fill: none;
      stroke-dasharray: 628;
      stroke-dashoffset: 628;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.05s linear;
    }
    .touch-btn {
      width: 165px;
      height: 165px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 35% 30%, #fb7185, #e11d48 85%);
      color: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 12px 35px var(--accent-glow);
      transition: transform 0.18s ease;
      z-index: 3;
    }
    .touch-btn:active { transform: scale(0.91); }
    .pulse-effect {
      animation: heartShock 0.65s infinite alternate cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes heartShock {
      0% { transform: scale(1); box-shadow: 0 0 20px var(--accent-glow); }
      100% { transform: scale(1.16); box-shadow: 0 0 65px rgba(244, 63, 94, 0.95); }
    }

    .touch-types-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      max-width: 100%;
      padding: 6px 4px;
      scrollbar-width: none;
    }
    .touch-types-grid::-webkit-scrollbar { display: none; }
    .type-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .type-pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #fda4af;
    }

    /* SECCIÓN 2: PIZARRA EN VIVO */
    .board-wrapper {
      width: 100%;
      max-width: 380px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    #paint-canvas {
      width: 100%;
      height: 340px;
      background: #090d16;
      touch-action: none;
      cursor: crosshair;
    }
    .board-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
    }
    .color-picker-row {
      display: flex;
      gap: 8px;
    }
    .color-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .color-circle.active {
      border-color: white;
      transform: scale(1.15);
    }
    .board-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Barra Inferior de Navegación */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom, 5px);
      z-index: 50;
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      width: 50%;
    }
    .nav-item.active {
      color: var(--accent);
    }
    .nav-item span.icon {
      font-size: 1.35rem;
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <div id="setup-screen">
    <h2 style="font-size: 1.4rem;">¿De quién es este celular?</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Configuración de inicio.</p>
    <button class="setup-btn" onclick="assignOwner('Jeremmy')">Es el celular de Jeremmy</button>
    <button class="setup-btn" onclick="assignOwner('Verónica')">Es el celular de Verónica</button>
  </div>

  <div class="top-bar">
    <div class="presence-badge">
      <div class="presence-dot"></div>
      <span id="user-display">Conectando...</span>
    </div>
    
    <div class="top-actions">
      <button class="icon-btn" onclick="forceAppRefresh(this)" title="Recargar">🔄</button>
      <button class="bell-btn" id="bell-btn" onclick="subscribePush()">🔔 Alertas</button>
    </div>
  </div>

  <!-- PESTAÑA 1: TOQUE -->
  <div class="tab-panel active" id="tab-touch">
    <div class="sync-card">
      <div class="sync-metric">
        <span class="label">Toques hoy</span>
        <span class="value" id="touch-count">0</span>
      </div>
      <div style="width: 1px; height: 28px; background: var(--card-border);"></div>
      <div class="sync-metric">
        <span class="label">Último toque</span>
        <span class="value" id="last-touch-time" style="color: #cbd5e1; font-size: 0.95rem;">--:--</span>
      </div>
    </div>

    <div class="heart-container">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <svg class="charge-svg">
        <circle class="charge-circle" id="charge-progress" cx="100" cy="100" r="90"></circle>
      </svg>
      <button class="touch-btn" id="main-heart"
              onpointerdown="startHeartPress(event)"
              onpointerup="endHeartPress(event)"
              onpointerleave="cancelHeartPress(event)">
        <span id="heart-icon" style="font-size: 2.7rem;">❤️</span>
        <span id="heart-label" style="font-weight: 700; font-size: 0.9rem;">Beso</span>
      </button>
    </div>

    <p id="touch-status" style="font-size: 0.95rem; color: #e2e8f0; min-height: 26px;">Toca o mantén presionado</p>

    <div class="touch-types-grid">
      <button class="type-pill active" onclick="selectType('❤️', 'Beso', 'te mandó un beso', this)">
        <span>❤️</span> Beso
      </button>
      <button class="type-pill" onclick="selectType('🫂', 'Abrazo', 'te mandó un abrazo apretado', this)">
        <span>🫂</span> Abrazo
      </button>
      <button class="type-pill" onclick="selectType('✨', 'Cosquillas', 'te anda haciendo cosquillas', this)">
        <span>✨</span> Cosquillas
      </button>
      <button class="type-pill" onclick="selectType('🤏', 'Pellizco', 'te dio un pellizquito de cariño', this)">
        <span>🤏</span> Pellizco
      </button>
    </div>
  </div>

  <!-- PESTAÑA 2: PIZARRA EN VIVO -->
  <div class="tab-panel" id="tab-board">
    <div class="board-wrapper">
      <canvas id="paint-canvas"></canvas>
      <div class="board-controls">
        <div class="color-picker-row">
          <div class="color-circle active" style="background: #f43f5e;" onclick="setColor('#f43f5e', this)"></div>
          <div class="color-circle" style="background: #38bdf8;" onclick="setColor('#38bdf8', this)"></div>
          <div class="color-circle" style="background: #facc15;" onclick="setColor('#facc15', this)"></div>
          <div class="color-circle" style="background: #ffffff;" onclick="setColor('#ffffff', this)"></div>
        </div>
        <div style="display: flex; gap: 6px;">
          <button class="board-btn" onclick="clearBoard(true)">🗑️ Borrar</button>
          <button class="board-btn" onclick="saveBoardSnapshot()">💾 Guardar</button>
        </div>
      </div>
    </div>
    <p id="board-status" style="font-size: 0.8rem; color: #94a3b8;">Dibuja algo, se ve al instante en su pantalla.</p>
  </div>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('tab-touch', this)">
      <span class="icon">❤️</span>
      <span>Toque</span>
    </button>
    <button class="nav-item" onclick="switchTab('tab-board', this)">
      <span class="icon">🎨</span>
      <span>Pizarra</span>
    </button>
  </nav>

  <script>
    const SUPABASE_URL = 'https://qxoaavedwbomrhszvgtx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b2FhdmVkd2JvbXJoc3p2Z3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMjY2NDksImV4cCI6MjEwNjcwMjY0OX0.XtQDxQchFLNB4ywhHKHvoR4aqOEyMVmoc1tBeQ1KHR8';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const VAPID_PUBLIC_KEY = 'BFNX4RqJrx-dwMNcseGOEwxYRXD9fU9B5ASfTIatfy6wpSYWMKZT5L-l1ug5kV6PHkSXuP3c49gC2UiQyK0sfac';

    // 1. Identidad de dispositivo
    const urlParams = new URLSearchParams(window.location.search);
    const paramUser = urlParams.get('yo');
    if (paramUser) {
      const formatted = paramUser.toLowerCase() === 'veronica' ? 'Verónica' : 'Jeremmy';
      localStorage.setItem('device_owner', formatted);
    }

    let currentOwner = localStorage.getItem('device_owner');

    if (!currentOwner) {
      document.getElementById('setup-screen').style.display = 'flex';
    } else {
      initApp();
    }

    function assignOwner(name) {
      currentOwner = name;
      localStorage.setItem('device_owner', name);
      document.getElementById('setup-screen').style.display = 'none';
      initApp();
      subscribePush();
    }

    function initApp() {
      const partner = currentOwner === 'Jeremmy' ? 'Verónica' : 'Jeremmy';
      document.getElementById('user-display').innerText = `${currentOwner} y ${partner}`;
      fetchTodayMetrics();
      checkPushStatus();
      initParticles();
      initBoard();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if (tabId === 'tab-board') {
        resizeBoardCanvas();
        loadSavedBoard();
      }
    }

    // 2. Partículas
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initParticles() { requestAnimationFrame(renderParticles); }

    function spawnHeartParticles(x, y, count = 12, char = '❤️') {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          alpha: 1,
          size: Math.random() * 10 + 16,
          char
        });
      }
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.018;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.font = `${p.size}px sans-serif`;
        ctx.fillText(p.char, p.x, p.y);
        ctx.restore();
        if (p.alpha <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(renderParticles);
    }

    // 3. Toques y Gestos
    let selectedEmoji = '❤️';
    let selectedLabel = 'Beso';
    let selectedActionText = 'te mandó un beso';

    function selectType(emoji, label, actionText, elem) {
      document.querySelectorAll('.type-pill').forEach(p => p.classList.remove('active'));
      elem.classList.add('active');
      selectedEmoji = emoji;
      selectedLabel = label;
      selectedActionText = actionText;
      document.getElementById('heart-icon').innerText = emoji;
      document.getElementById('heart-label').innerText = label;
    }

    let pressTimer = null;
    let pressStartTime = 0;
    let isLongHold = false;
    const holdDuration = 1000;

    function startHeartPress(e) {
      pressStartTime = Date.now();
      isLongHold = false;
      const circle = document.getElementById('charge-progress');
      pressTimer = setInterval(() => {
        const elapsed = Date.now() - pressStartTime;
        const progress = Math.min(1, elapsed / holdDuration);
        circle.style.strokeDashoffset = 628 - (progress * 628);
        if (progress >= 1 && !isLongHold) {
          isLongHold = true;
          if ('vibrate' in navigator) navigator.vibrate([300, 100, 450]);
          clearInterval(pressTimer);
          triggerSend(true, e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
        }
      }, 30);
    }

    function endHeartPress(e) {
      const circle = document.getElementById('charge-progress');
      circle.style.strokeDashoffset = 628;
      if (pressTimer) clearInterval(pressTimer);
      if (!isLongHold) {
        triggerSend(false, e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
      }
    }

    function cancelHeartPress() {
      const circle = document.getElementById('charge-progress');
      circle.style.strokeDashoffset = 628;
      if (pressTimer) clearInterval(pressTimer);
    }

    async function triggerSend(isHold, x, y) {
      const btn = document.getElementById('main-heart');
      const status = document.getElementById('touch-status');
      const partner = currentOwner === 'Jeremmy' ? 'Verónica' : 'Jeremmy';

      btn.style.transform = 'scale(0.86)';
      setTimeout(() => btn.style.transform = 'scale(1)', 140);
      if ('vibrate' in navigator) navigator.vibrate(isHold ? 250 : 70);

      spawnHeartParticles(x, y, isHold ? 20 : 12, isHold ? '🫂' : selectedEmoji);
      status.innerText = isHold ? 'Enviando abrazo apretado...' : 'Enviando...';

      const action = isHold ? 'te mandó un abrazo apretado prolongado' : selectedActionText;

      await supabaseClient.from('pings').insert([{ sender: currentOwner }]);

      try {
        const { data } = await supabaseClient.functions.invoke('send-push', {
          body: { record: { sender: currentOwner, body: `${currentOwner} ${action}` } }
        });
        if (data && data.delivered) status.innerText = `✓ Entregado al celular de ${partner}`;
        else status.innerText = `⚠ Enviado (Esperando que ${partner} active alertas)`;
      } catch (e) {
        status.innerText = '✓ Enviado';
      }

      fetchTodayMetrics();
      setTimeout(() => { status.innerText = 'Toca o mantén presionado'; }, 3500);
    }

    // 4. Métricas de Toques: Solo cuenta desde las 00:00:00 de hoy
    async function fetchTodayMetrics() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const { count } = await supabaseClient
        .from('pings')
        .select('*', { count: 'exact', head: true })
        .gte('created_at', today.toISOString());

      if (count !== null) document.getElementById('touch-count').innerText = count;

      const { data: latest } = await supabaseClient
        .from('pings')
        .select('created_at, sender')
        .neq('sender', currentOwner)
        .order('created_at', { ascending: false })
        .limit(1);

      if (latest && latest.length > 0) {
        const time = new Date(latest[0].created_at);
        document.getElementById('last-touch-time').innerText = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
    }

    // 5. Motor de Pizarra en Vivo (WebSockets Broadcast en tiempo real)
    const boardCanvas = document.getElementById('paint-canvas');
    const boardCtx = boardCanvas.getContext('2d');
    let isDrawing = false;
    let currentColor = '#f43f5e';
    let currentLineWidth = 4;
    let lastX = 0;
    let lastY = 0;
    let whiteboardChannel = null;

    function resizeBoardCanvas() {
      const rect = boardCanvas.getBoundingClientRect();
      if (boardCanvas.width !== rect.width || boardCanvas.height !== rect.height) {
        // Guardar dibujo previo al redimensionar
        const temp = boardCtx.getImageData(0, 0, boardCanvas.width, boardCanvas.height);
        boardCanvas.width = rect.width;
        boardCanvas.height = rect.height;
        boardCtx.putImageData(temp, 0, 0);
        boardCtx.lineCap = 'round';
        boardCtx.lineJoin = 'round';
      }
    }

    function setColor(color, elem) {
      currentColor = color;
      document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('active'));
      elem.classList.add('active');
    }

    function initBoard() {
      boardCtx.lineCap = 'round';
      boardCtx.lineJoin = 'round';

      // Eventos Táctiles y de Ratón
      const startDraw = (e) => {
        isDrawing = true;
        const pos = getPos(e);
        lastX = pos.x;
        lastY = pos.y;
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const pos = getPos(e);

        drawLine(lastX, lastY, pos.x, pos.y, currentColor, currentLineWidth, true);

        lastX = pos.x;
        lastY = pos.y;
      };

      const stopDraw = () => { isDrawing = false; };

      boardCanvas.addEventListener('pointerdown', startDraw);
      boardCanvas.addEventListener('pointermove', draw);
      window.addEventListener('pointerup', stopDraw);

      // Canal Supabase Realtime para la pizarra
      whiteboardChannel = supabaseClient.channel('whiteboard-live', {
        config: { broadcast: { self: false } }
      });

      whiteboardChannel
        .on('broadcast', { event: 'draw-line' }, ({ payload }) => {
          // Re-escalar coordenadas normalizadas para que se vean idénticas en cualquier pantalla
          const w = boardCanvas.width;
          const h = boardCanvas.height;
          drawLine(payload.x0 * w, payload.y0 * h, payload.x1 * w, payload.y1 * h, payload.color, payload.width, false);
        })
        .on('broadcast', { event: 'clear-board' }, () => {
          clearBoard(false);
        })
        .subscribe();
    }

    function getPos(e) {
      const rect = boardCanvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function drawLine(x0, y0, x1, y1, color, width, broadcast = true) {
      boardCtx.strokeStyle = color;
      boardCtx.lineWidth = width;
      boardCtx.beginPath();
      boardCtx.moveTo(x0, y0);
      boardCtx.lineTo(x1, y1);
      boardCtx.stroke();

      if (broadcast && whiteboardChannel) {
        // Enviar coordenadas normalizadas de 0 a 1
        const w = boardCanvas.width;
        const h = boardCanvas.height;
        whiteboardChannel.send({
          type: 'broadcast',
          event: 'draw-line',
          payload: {
            x0: x0 / w, y0: y0 / h,
            x1: x1 / w, y1: y1 / h,
            color, width
          }
        });
      }
    }

    function clearBoard(broadcast = true) {
      boardCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
      if (broadcast && whiteboardChannel) {
        whiteboardChannel.send({
          type: 'broadcast',
          event: 'clear-board',
          payload: {}
        });
        document.getElementById('board-status').innerText = 'Pizarra limpiada.';
        setTimeout(() => { document.getElementById('board-status').innerText = 'Dibuja algo, se ve al instante en su pantalla.'; }, 2000);
      }
    }

    async function saveBoardSnapshot() {
      const dataUrl = boardCanvas.toDataURL('image/png', 0.5);
      const status = document.getElementById('board-status');
      status.innerText = 'Guardando...';

      await supabaseClient.from('whiteboard_state').upsert({
        id: 1,
        image_data: dataUrl,
        updated_by: currentOwner,
        updated_at: new Date().toISOString()
      });

      status.innerText = '✓ Pizarra guardada para ambos.';
      setTimeout(() => { status.innerText = 'Dibuja algo, se ve al instante en su pantalla.'; }, 2500);
    }

    async function loadSavedBoard() {
      const { data } = await supabaseClient.from('whiteboard_state').select('image_data').eq('id', 1).single();
      if (data && data.image_data && data.image_data.length > 50) {
        const img = new Image();
        img.onload = () => {
          boardCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
          boardCtx.drawImage(img, 0, 0, boardCanvas.width, boardCanvas.height);
        };
        img.src = data.image_data;
      }
    }

    // 6. Push & Service Worker
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    async function subscribePush() {
      if (!('serviceWorker' in navigator)) return;
      const b = document.getElementById('bell-btn');
      b.innerText = 'Activando...';

      try {
        const reg = await navigator.serviceWorker.ready;
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const oldSub = await reg.pushManager.getSubscription();
          if (oldSub) await oldSub.unsubscribe();

          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });

          await supabaseClient.from('push_subscriptions').upsert({
            user_name: currentOwner,
            subscription: sub.toJSON(),
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_name' });

          b.innerText = '✓ Alertas listas';
          b.classList.add('synced');
          alert(`Alertas activadas para ${currentOwner}`);
        } else {
          b.innerText = '🔔 Alertas';
        }
      } catch (e) {
        b.innerText = '🔔 Alertas';
      }
    }

    async function checkPushStatus() {
      if ('Notification' in window && Notification.permission === 'granted') {
        const b = document.getElementById('bell-btn');
        b.innerText = '✓ Alertas listas';
        b.classList.add('synced');
      }
    }

    // Escucha en Vivo de Toques
    supabaseClient.channel('live-touch-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pings' }, (payload) => {
        if (payload.new.sender !== currentOwner) {
          const btn = document.getElementById('main-heart');
          const status = document.getElementById('touch-status');
          status.innerText = `${payload.new.sender} te acaba de tocar la pantalla.`;
          btn.classList.add('pulse-effect');
          if ('vibrate' in navigator) navigator.vibrate([500, 150, 500, 150, 800]);

          const rect = btn.getBoundingClientRect();
          spawnHeartParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 25, '❤️');
          fetchTodayMetrics();

          setTimeout(() => {
            btn.classList.remove('pulse-effect');
            status.innerText = 'Toca o mantén presionado';
          }, 4500);
        }
      })
      .subscribe();

    async function forceAppRefresh(btn) {
      if (btn) {
        btn.style.transform = 'rotate(360deg)';
        btn.style.transition = 'transform 0.6s ease';
      }
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) await reg.update();
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      setTimeout(() => { window.location.reload(true); }, 300);
    }

    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
      navigator.serviceWorker.register('sw.js').then((registration) => {
        registration.update();
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              newWorker.postMessage({ action: 'skipWaiting' });
            }
          });
        });
        checkPushStatus();
      });
    }
  </script>
