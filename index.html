<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nosotros</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nosotros">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #070a13;
      --card-bg: rgba(19, 27, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #f43f5e;
      --accent-soft: rgba(244, 63, 94, 0.15);
      --accent-glow: rgba(244, 63, 94, 0.45);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(244, 63, 94, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 42px) 20px calc(env(safe-area-inset-bottom, 20px) + 20px);
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* Canvas para partículas flotantes */
    #particles-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Modal de configuración inicial si falta usuario */
    #setup-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      gap: 20px;
    }
    .setup-btn {
      width: 100%;
      max-width: 290px;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }
    .setup-btn:active { transform: scale(0.96); background: rgba(244, 63, 94, 0.2); }

    /* Barra Superior */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      z-index: 2;
    }
    .presence-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      font-size: 0.8rem;
      font-weight: 500;
    }
    .presence-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse-dot 2s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .bell-btn {
      background: var(--accent-soft);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .bell-btn.synced {
      background: transparent;
      border-color: rgba(16, 185, 129, 0.3);
      color: #10b981;
    }

    /* Panel Central */
    .touch-dashboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      z-index: 2;
    }

    /* Métrica de sintonía */
    .sync-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }
    .sync-metric {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .sync-metric span.label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sync-metric span.value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* Contenedor del Botón Central con halo */
    .heart-container {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    .pulse-ring {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 2px solid rgba(244, 63, 94, 0.25);
      animation: ripple 3s infinite cubic-bezier(0.1, 0.2, 0.4, 1);
    }
    .pulse-ring:nth-child(2) {
      animation-delay: 1.5s;
    }
    @keyframes ripple {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    /* SVG de carga circular para toque sostenido */
    .charge-svg {
      position: absolute;
      width: 210px;
      height: 210px;
      transform: rotate(-90deg);
      pointer-events: none;
    }
    .charge-circle {
      stroke: var(--accent);
      stroke-width: 4;
      fill: none;
      stroke-dasharray: 628;
      stroke-dashoffset: 628;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.1s linear;
    }

    .touch-btn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 35% 30%, #fb7185, #e11d48 85%);
      color: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 12px 35px var(--accent-glow);
      transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 3;
    }
    .touch-btn:active { transform: scale(0.91); }

    .pulse-effect {
      animation: heartShock 0.65s infinite alternate cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes heartShock {
      0% { transform: scale(1); box-shadow: 0 0 20px var(--accent-glow); }
      100% { transform: scale(1.16); box-shadow: 0 0 65px rgba(244, 63, 94, 0.95); }
    }

    #touch-status {
      font-size: 0.95rem;
      color: #e2e8f0;
      min-height: 26px;
      font-weight: 500;
    }

    /* Selector de emociones */
    .touch-types-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      max-width: 100%;
      padding: 6px 4px;
      scrollbar-width: none;
    }
    .touch-types-grid::-webkit-scrollbar { display: none; }
    .type-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .type-pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #fda4af;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.25);
    }

    .footer-note {
      font-size: 0.72rem;
      color: #475569;
      z-index: 2;
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <div id="setup-screen">
    <h2 style="font-size: 1.4rem;">¿De quién es este celular?</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Configuración única de inicio.</p>
    <button class="setup-btn" onclick="assignOwner('Jeremmy')">Es el celular de Jeremmy</button>
    <button class="setup-btn" onclick="assignOwner('Verónica')">Es el celular de Verónica</button>
  </div>

  <div class="top-bar">
    <div class="presence-badge">
      <div class="presence-dot"></div>
      <span id="user-display">Conectando...</span>
    </div>
    <button class="bell-btn" id="bell-btn" onclick="subscribePush()">🔔 Alertas</button>
  </div>

  <div class="touch-dashboard">
    <div class="sync-card">
      <div class="sync-metric">
        <span class="label">Toques hoy</span>
        <span class="value" id="touch-count">0</span>
      </div>
      <div style="width: 1px; height: 28px; background: var(--card-border);"></div>
      <div class="sync-metric">
        <span class="label">Último toque</span>
        <span class="value" id="last-touch-time" style="color: #cbd5e1; font-size: 0.95rem;">--:--</span>
      </div>
    </div>

    <div class="heart-container">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      
      <!-- Círculo SVG de carga táctil -->
      <svg class="charge-svg">
        <circle class="charge-circle" id="charge-progress" cx="105" cy="105" r="95"></circle>
      </svg>

      <button class="touch-btn" id="main-heart"
              onpointerdown="startHeartPress(event)"
              onpointerup="endHeartPress(event)"
              onpointerleave="cancelHeartPress(event)">
        <span id="heart-icon" style="font-size: 2.8rem;">❤️</span>
        <span id="heart-label" style="font-weight: 700; font-size: 0.95rem;">Beso</span>
      </button>
    </div>

    <p id="touch-status">Toca suave o mantén para un abrazo</p>

    <div class="touch-types-grid">
      <button class="type-pill active" onclick="selectType('❤️', 'Beso', 'te mandó un beso', this)">
        <span>❤️</span> Beso
      </button>
      <button class="type-pill" onclick="selectType('🫂', 'Abrazo', 'te mandó un abrazo apretado', this)">
        <span>🫂</span> Abrazo
      </button>
      <button class="type-pill" onclick="selectType('✨', 'Cosquillas', 'te anda haciendo cosquillas', this)">
        <span>✨</span> Cosquillas
      </button>
      <button class="type-pill" onclick="selectType('🤏', 'Pellizco', 'te dio un pellizquito de cariño', this)">
        <span>🤏</span> Pellizco
      </button>
    </div>
  </div>

  <div class="footer-note">Canal privado y cifrado en tiempo real</div>

  <script>
    const SUPABASE_URL = 'https://qxoaavedwbomrhszvgtx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b2FhdmVkd2JvbXJoc3p2Z3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMjY2NDksImV4cCI6MjEwNjcwMjY0OX0.XtQDxQchFLNB4ywhHKHvoR4aqOEyMVmoc1tBeQ1KHR8';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const VAPID_PUBLIC_KEY = 'BFNX4RqJrx-dwMNcseGOEwxYRXD9fU9B5ASfTIatfy6wpSYWMKZT5L-l1ug5kV6PHkSXuP3c49gC2UiQyK0sfac';

    // 1. Identidad del dispositivo
    const urlParams = new URLSearchParams(window.location.search);
    const paramUser = urlParams.get('yo');
    if (paramUser) {
      const formatted = paramUser.toLowerCase() === 'veronica' ? 'Verónica' : 'Jeremmy';
      localStorage.setItem('device_owner', formatted);
    }

    let currentOwner = localStorage.getItem('device_owner');

    if (!currentOwner) {
      document.getElementById('setup-screen').style.display = 'flex';
    } else {
      initApp();
    }

    function assignOwner(name) {
      currentOwner = name;
      localStorage.setItem('device_owner', name);
      document.getElementById('setup-screen').style.display = 'none';
      initApp();
      subscribePush();
    }

    function initApp() {
      const partner = currentOwner === 'Jeremmy' ? 'Verónica' : 'Jeremmy';
      document.getElementById('user-display').innerText = `${currentOwner} y ${partner}`;
      fetchTodayMetrics();
      checkPushStatus();
      initParticles();
    }

    // 2. Motor de Partículas en Canvas
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initParticles() {
      requestAnimationFrame(renderParticles);
    }

    function spawnHeartParticles(x, y, count = 12, char = '❤️') {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1.5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          alpha: 1,
          size: Math.random() * 10 + 16,
          char: char
        });
      }
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.018;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.font = `${p.size}px sans-serif`;
        ctx.fillText(p.char, p.x, p.y);
        ctx.restore();

        if (p.alpha <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(renderParticles);
    }

    // 3. Emociones
    let selectedEmoji = '❤️';
    let selectedLabel = 'Beso';
    let selectedActionText = 'te mandó un beso';

    function selectType(emoji, label, actionText, elem) {
      document.querySelectorAll('.type-pill').forEach(p => p.classList.remove('active'));
      elem.classList.add('active');
      selectedEmoji = emoji;
      selectedLabel = label;
      selectedActionText = actionText;
      document.getElementById('heart-icon').innerText = emoji;
      document.getElementById('heart-label').innerText = label;
    }

    // 4. Toque sostenido (Long Press) con medidor perimetral
    let pressTimer = null;
    let pressStartTime = 0;
    let isLongHold = false;
    const holdDuration = 1000; // 1 segundo para abrazo profundo

    function startHeartPress(e) {
      pressStartTime = Date.now();
      isLongHold = false;
      const circle = document.getElementById('charge-progress');

      pressTimer = setInterval(() => {
        const elapsed = Date.now() - pressStartTime;
        const progress = Math.min(1, elapsed / holdDuration);
        const offset = 628 - (progress * 628);
        circle.style.strokeDashoffset = offset;

        if (progress >= 1 && !isLongHold) {
          isLongHold = true;
          if ('vibrate' in navigator) navigator.vibrate([300, 100, 450]);
          clearInterval(pressTimer);
          triggerSend(true, e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
        }
      }, 30);
    }

    function endHeartPress(e) {
      const circle = document.getElementById('charge-progress');
      circle.style.strokeDashoffset = 628;
      if (pressTimer) clearInterval(pressTimer);

      if (!isLongHold) {
        triggerSend(false, e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
      }
    }

    function cancelHeartPress() {
      const circle = document.getElementById('charge-progress');
      circle.style.strokeDashoffset = 628;
      if (pressTimer) clearInterval(pressTimer);
    }

    async function triggerSend(isHold, x, y) {
      const btn = document.getElementById('main-heart');
      const status = document.getElementById('touch-status');
      const partner = currentOwner === 'Jeremmy' ? 'Verónica' : 'Jeremmy';

      btn.style.transform = 'scale(0.86)';
      setTimeout(() => btn.style.transform = 'scale(1)', 140);
      if ('vibrate' in navigator) navigator.vibrate(isHold ? 250 : 70);

      spawnHeartParticles(x, y, isHold ? 20 : 12, isHold ? '🫂' : selectedEmoji);

      status.innerText = isHold ? 'Enviando abrazo apretado...' : 'Enviando...';

      const action = isHold ? 'te mandó un abrazo apretado prolongado' : selectedActionText;

      // 1. Guardar en Base de Datos
      await supabaseClient.from('pings').insert([{ sender: currentOwner }]);

      // 2. Disparar Edge Function
      try {
        const { data } = await supabaseClient.functions.invoke('send-push', {
          body: {
            record: {
              sender: currentOwner,
              body: `${currentOwner} ${action}`
            }
          }
        });

        if (data && data.delivered) {
          status.innerText = `✓ Entregado al celular de ${partner}`;
        } else {
          status.innerText = `⚠ Enviado (Esperando que ${partner} active alertas)`;
        }
      } catch (e) {
        status.innerText = '✓ Enviado';
      }

      fetchTodayMetrics();
      setTimeout(() => {
        status.innerText = 'Toca suave o mantén para un abrazo';
      }, 3500);
    }

    // 5. Métricas de toques y hora
    async function fetchTodayMetrics() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const { count } = await supabaseClient
        .from('pings')
        .select('*', { count: 'exact', head: true })
        .gte('created_at', today.toISOString());

      if (count !== null) document.getElementById('touch-count').innerText = count;

      // Último toque recibido
      const { data: latest } = await supabaseClient
        .from('pings')
        .select('created_at, sender')
        .neq('sender', currentOwner)
        .order('created_at', { ascending: false })
        .limit(1);

      if (latest && latest.length > 0) {
        const time = new Date(latest[0].created_at);
        document.getElementById('last-touch-time').innerText = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
    }

    // 6. Push Subscription
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    async function subscribePush() {
      if (!('serviceWorker' in navigator)) return;
      const b = document.getElementById('bell-btn');
      b.innerText = 'Activando...';

      try {
        const reg = await navigator.serviceWorker.ready;
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const oldSub = await reg.pushManager.getSubscription();
          if (oldSub) await oldSub.unsubscribe();

          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });

          await supabaseClient.from('push_subscriptions').upsert({
            user_name: currentOwner,
            subscription: sub.toJSON(),
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_name' });

          b.innerText = '✓ Alertas listas';
          b.classList.add('synced');
          alert(`Alertas activadas para ${currentOwner}`);
        } else {
          b.innerText = '🔔 Alertas';
        }
      } catch (e) {
        b.innerText = '🔔 Alertas';
      }
    }

    async function checkPushStatus() {
      if ('Notification' in window && Notification.permission === 'granted') {
        const b = document.getElementById('bell-btn');
        b.innerText = '✓ Alertas listas';
        b.classList.add('synced');
      }
    }

    // 7. Recepción en Vivo vía WebSockets
    supabaseClient.channel('live-touch-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pings' }, (payload) => {
        if (payload.new.sender !== currentOwner) {
          const btn = document.getElementById('main-heart');
          const status = document.getElementById('touch-status');
          status.innerText = `${payload.new.sender} te acaba de tocar la pantalla.`;
          btn.classList.add('pulse-effect');

          if ('vibrate' in navigator) navigator.vibrate([500, 150, 500, 150, 800]);

          const rect = btn.getBoundingClientRect();
          spawnHeartParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 25, '❤️');

          fetchTodayMetrics();

          setTimeout(() => {
            btn.classList.remove('pulse-effect');
            status.innerText = 'Toca suave o mantén para un abrazo';
          }, 4500);
        }
      })
      .subscribe();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => checkPushStatus());
    }
  </script>
</body>
</html>
