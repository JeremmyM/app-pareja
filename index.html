<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nosotros</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nosotros">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.45);
      --text: #f8fafc;
      --text-muted: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 40px) 18px calc(env(safe-area-inset-bottom, 20px) + 70px);
      text-align: center;
      overflow-x: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }
    .user-pill {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 4px;
      display: flex;
      gap: 4px;
    }
    .user-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    .user-btn.active {
      background: #1e293b;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .bell-btn {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .bell-btn.synced {
      background: transparent;
      border-color: rgba(16, 185, 129, 0.3);
      color: #10b981;
    }

    /* Contenedor interactivo */
    .touch-dashboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
    }

    /* Contador diario */
    .counter-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #cbd5e1;
    }
    .counter-badge b {
      color: var(--accent);
    }

    /* Botón central con indicador de presión sostenida */
    .heart-wrapper {
      position: relative;
      margin: 10px 0;
    }
    .touch-btn {
      width: 175px;
      height: 175px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 30% 30%, #fb7185, #e11d48 85%);
      color: white;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 10px 35px var(--accent-glow);
      transition: transform 0.15s ease;
      position: relative;
      z-index: 2;
    }
    .touch-btn:active { transform: scale(0.90); }

    .pulse-effect {
      animation: heartShock 0.7s infinite alternate cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes heartShock {
      0% { transform: scale(1); box-shadow: 0 0 20px var(--accent-glow); }
      100% { transform: scale(1.15); box-shadow: 0 0 55px rgba(244, 63, 94, 0.9); }
    }

    /* Selector de tipos de toque */
    .touch-types-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      max-width: 100%;
      padding: 4px;
      scrollbar-width: none;
    }
    .touch-types-grid::-webkit-scrollbar { display: none; }
    .type-pill {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .type-pill.active {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--accent);
      color: #fda4af;
    }

    #touch-status {
      font-size: 0.95rem;
      color: #cbd5e1;
      min-height: 24px;
    }

    /* Barra inferior */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(19, 27, 46, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom, 5px);
      z-index: 50;
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="user-pill">
      <button class="user-btn active" id="btn-jeremmy" onclick="setProfile('Jeremmy')">Jeremmy</button>
      <button class="user-btn" id="btn-pareja" onclick="setProfile('Verónica')">Verónica</button>
    </div>
    <button class="bell-btn" id="bell-btn" onclick="subscribePush()">🔔 Alertas</button>
  </div>

  <div class="touch-dashboard">
    <!-- Contador de toques hoy -->
    <div class="counter-badge">
      Toques de hoy: <b id="touch-count">0</b>
    </div>

    <!-- Botón central interactivo -->
    <div class="heart-wrapper">
      <button class="touch-btn" id="main-heart" 
              onpointerdown="startPress(event)" 
              onpointerup="endPress(event)">
        <span id="heart-icon" style="font-size: 2.6rem;">❤️</span>
        <span id="heart-label">Pensándote</span>
      </button>
    </div>

    <p id="touch-status">Toca o mantén presionado</p>

    <!-- Selector de gestos -->
    <div class="touch-types-grid">
      <button class="type-pill active" onclick="selectType('❤️', 'Pensándote', 'te mandó un beso', this)">
        <span>❤️️</span> Beso
      </button>
      <button class="type-pill" onclick="selectType('🫂', 'Abrazo', 'te mandó un abrazo apretado', this)">
        <span>🫂</span> Abrazo
      </button>
      <button class="type-pill" onclick="selectType('✨', 'Cosquillas', 'te anda haciendo cosquillas', this)">
        <span>✨</span> Cosquillas
      </button>
      <button class="type-pill" onclick="selectType('🥺', 'Te extraño', 'te extraña mucho ahora', this)">
        <span>🥺</span> Te extraño
      </button>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item">
      <span style="font-size: 1.4rem;">❤️</span>
      <span>Toque</span>
    </div>
  </nav>

  <script>
    const SUPABASE_URL = 'https://qxoaavedwbomrhszvgtx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b2FhdmVkd2JvbXJoc3p2Z3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMjY2NDksImV4cCI6MjEwNjcwMjY0OX0.XtQDxQchFLNB4ywhHKHvoR4aqOEyMVmoc1tBeQ1KHR8';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const VAPID_PUBLIC_KEY = 'BFNX4RqJrx-dwMNcseGOEwxYRXD9fU9B5ASfTIatfy6wpSYWMKZT5L-l1ug5kV6PHkSXuP3c49gC2UiQyK0sfac';

    let currentOwner = localStorage.getItem('pair_app_owner') || 'Jeremmy';
    let selectedEmoji = '❤️';
    let selectedLabel = 'Pensándote';
    let selectedActionText = 'te mandó un beso';
    let pressTimer = null;
    let isLongPress = false;

    updateProfileUI();
    fetchTodayCount();

    function setProfile(name) {
      currentOwner = name;
      localStorage.setItem('pair_app_owner', name);
      updateProfileUI();
      checkPushStatus();
    }

    function updateProfileUI() {
      document.getElementById('btn-jeremmy').className = currentOwner === 'Jeremmy' ? 'user-btn active' : 'user-btn';
      document.getElementById('btn-pareja').className = currentOwner === 'Verónica' ? 'user-btn active' : 'user-btn';
    }

    function selectType(emoji, label, actionText, elem) {
      document.querySelectorAll('.type-pill').forEach(p => p.classList.remove('active'));
      elem.classList.add('active');
      selectedEmoji = emoji;
      selectedLabel = label;
      selectedActionText = actionText;
      document.getElementById('heart-icon').innerText = emoji;
      document.getElementById('heart-label').innerText = label;
    }

    // Manejador de pulsación corta vs pulsación sostenida (Long Press)
    function startPress(e) {
      isLongPress = false;
      pressTimer = setTimeout(() => {
        isLongPress = true;
        if ('vibrate' in navigator) navigator.vibrate([300, 100, 400]);
        sendSignal(true);
      }, 750);
    }

    function endPress(e) {
      if (pressTimer) clearTimeout(pressTimer);
      if (!isLongPress) {
        sendSignal(false);
      }
    }

    async function sendSignal(isHold) {
      const btn = document.getElementById('main-heart');
      const status = document.getElementById('touch-status');
      
      btn.style.transform = 'scale(0.86)';
      setTimeout(() => btn.style.transform = 'scale(1)', 140);
      if ('vibrate' in navigator) navigator.vibrate(isHold ? 250 : 70);

      const action = isHold ? `te mandó un abrazo fuerte prolongado` : selectedActionText;
      status.innerText = isHold ? '¡Abrazo fuerte enviado!' : 'Listo, ya le llegó.';

      // 1. Guardar en Supabase
      await supabaseClient.from('pings').insert([{ 
        sender: currentOwner, 
        created_at: new Date().toISOString() 
      }]);

      // 2. Disparar Edge Function para notificación en pantalla apagada
      supabaseClient.functions.invoke('send-push', {
        body: { 
          record: { 
            sender: currentOwner,
            body: `${currentOwner} ${action}`
          } 
        }
      }).catch(err => console.error("Error Edge Push:", err));

      fetchTodayCount();
      setTimeout(() => status.innerText = 'Toca o mantén presionado', 2500);
    }

    // Contador de toques del día
    async function fetchTodayCount() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const { count } = await supabaseClient
        .from('pings')
        .select('*', { count: 'exact', head: true })
        .gte('created_at', today.toISOString());
      if (count !== null) document.getElementById('touch-count').innerText = count;
    }

    // Web Audio sintetizado suave
    function playHeartSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const stroke = (time, freq) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, time);
          osc.frequency.exponentialRampToValueAtTime(35, time + 0.18);
          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.exponentialRampToValueAtTime(0.35, time + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(time);
          osc.stop(time + 0.19);
        };
        const now = ctx.currentTime;
        stroke(now, 95);
        stroke(now + 0.22, 110);
      } catch (e) {}
    }

    // Suscripción Push
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    async function subscribePush() {
      if (!('serviceWorker' in navigator)) return;
      try {
        const reg = await navigator.serviceWorker.ready;
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });

          await supabaseClient.from('push_subscriptions').upsert({
            user_name: currentOwner,
            subscription: sub.toJSON(),
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_name' });

          const b = document.getElementById('bell-btn');
          b.innerText = '✓ Alertas listas';
          b.classList.add('synced');
          alert(`Alertas conectadas correctamente para ${currentOwner}`);
        } else {
          alert('Permite las notificaciones para avisarte con la app cerrada.');
        }
      } catch (e) {
        alert('Error activando alertas: ' + e.message);
      }
    }

    async function checkPushStatus() {
      if ('Notification' in window && Notification.permission === 'granted') {
        const b = document.getElementById('bell-btn');
        b.innerText = '✓ Alertas listas';
        b.classList.add('synced');
      }
    }

    // Recepción en vivo vía WebSockets
    supabaseClient.channel('live-touch-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pings' }, (payload) => {
        if (payload.new.sender !== currentOwner) {
          const btn = document.getElementById('main-heart');
          const status = document.getElementById('touch-status');
          status.innerText = `${payload.new.sender} se acordó de ti justo ahora.`;
          btn.classList.add('pulse-effect');
          if ('vibrate' in navigator) navigator.vibrate([500, 150, 500, 150, 800]);
          playHeartSound();
          fetchTodayCount();
          setTimeout(() => {
            btn.classList.remove('pulse-effect');
            status.innerText = 'Toca o mantén presionado';
          }, 4500);
        }
      })
      .subscribe();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => checkPushStatus());
    }
  </script>
</body>
</html>
