<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Perfil - Nosotros</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #070a13;
      --card-bg: rgba(19, 27, 46, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #f43f5e;
      --accent-soft: rgba(244, 63, 94, 0.15);
      --accent-glow: rgba(244, 63, 94, 0.45);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(244, 63, 94, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 42px) 18px calc(env(safe-area-inset-bottom, 20px) + 75px);
      text-align: center;
      overflow-x: hidden;
    }

    /* Cabecera de Pareja */
    .couple-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 15px 0 25px;
      position: relative;
    }
    .user-profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .avatar-wrapper {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      padding: 3px;
      box-shadow: 0 0 20px var(--accent-glow);
      background: var(--card-bg);
      overflow: hidden;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .connector-heart {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      animation: float 2.5s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* Grilla de Métricas Estilo Tarjetas */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .metric-icon {
      font-size: 1.6rem;
      margin-bottom: 2px;
    }
    .metric-title {
      font-size: 0.68rem;
      color: var(--text-muted);
      line-height: 1.1;
      font-weight: 500;
    }
    .metric-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 2px;
    }

    /* Tarjeta Aniversario Destacada */
    .anniversary-banner {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.18), rgba(99, 102, 241, 0.18));
      border: 1px solid rgba(244, 63, 94, 0.35);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }
    .banner-title {
      font-size: 0.8rem;
      color: #fda4af;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .banner-text {
      font-size: 1.2rem;
      font-weight: 700;
      color: white;
      margin-top: 4px;
    }
    .banner-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Selector de Estado de Ánimo */
    .mood-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 20px;
      text-align: left;
    }
    .mood-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: block;
    }
    .mood-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .mood-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 1.25rem;
      cursor: pointer;
      flex: 1;
      transition: all 0.2s ease;
    }
    .mood-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      transform: scale(1.08);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Barra Inferior de 3 Pestañas */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom, 5px);
      z-index: 100;
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.72rem;
      text-decoration: none;
      width: 33.3%;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item span.icon { font-size: 1.3rem; }
  </style>
</head>
<body>

  <!-- Pareja y Avatares -->
  <div class="couple-header">
    <div class="user-profile">
      <div class="avatar-wrapper">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Jeremmy" class="avatar-img" alt="Jeremmy" id="avatar-jeremmy">
      </div>
      <span class="user-name">Jeremmy</span>
    </div>

    <div class="connector-heart">
      <span style="font-size: 1.8rem;">☁️❤️☁️</span>
    </div>

    <div class="user-profile">
      <div class="avatar-wrapper">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Veronica" class="avatar-img" alt="Вероничка" id="avatar-veronica">
      </div>
      <span class="user-name">Вероничка</span>
    </div>
  </div>

  <!-- Banner Aniversario: 25 de junio de 2024 -->
  <div class="anniversary-banner">
    <div>
      <span class="banner-title">Juntos desde el 25 de junio</span>
      <div class="banner-text" id="anniversary-counter">Cargando...</div>
      <div class="banner-sub" id="anniversary-sub">Iniciamos en 2024</div>
    </div>
    <div style="font-size: 2.2rem;">💍</div>
  </div>

  <!-- Grilla de Métricas (Inspirada en tu captura) -->
  <div class="metrics-grid">
    <div class="metric-card">
      <span class="metric-icon">💞</span>
      <span class="metric-title">Juntos Desde</span>
      <span class="metric-value" id="days-together-stat">0</span>
    </div>

    <div class="metric-card">
      <span class="metric-icon">💋</span>
      <span class="metric-title">MissU Toques</span>
      <span class="metric-value" id="total-touches-stat">0</span>
    </div>

    <div class="metric-card">
      <span class="metric-icon">🔥</span>
      <span class="metric-title">Racha Amor</span>
      <span class="metric-value" id="streak-stat">1</span>
    </div>

    <div class="metric-card">
      <span class="metric-icon">⏳</span>
      <span class="metric-title">Próx. Aniv.</span>
      <span class="metric-value" id="next-aniv-days">0d</span>
    </div>

    <div class="metric-card">
      <span class="metric-icon">💖</span>
      <span class="metric-title">Intimidad</span>
      <span class="metric-value">100%</span>
    </div>

    <div class="metric-card">
      <span class="metric-icon">🐾</span>
      <span class="metric-title">Mascota</span>
      <span class="metric-value">Lv. 1</span>
    </div>
  </div>

  <!-- Selector de Estado de Ánimo Compartido -->
  <div class="mood-card">
    <span class="mood-label">¿Cómo te sientes hoy? (Ella lo verá en vivo)</span>
    <div class="mood-row">
      <button class="mood-btn" onclick="setMood('🥰', this)" title="Enamorado">🥰</button>
      <button class="mood-btn" onclick="setMood('🥺', this)" title="Te extraño">🥺</button>
      <button class="mood-btn" onclick="setMood('😴', this)" title="Con sueño">😴</button>
      <button class="mood-btn" onclick="setMood('✨', this)" title="Feliz">✨</button>
      <button class="mood-btn" onclick="setMood('🫂', this)" title="Necesito abrazo">🫂</button>
    </div>
  </div>

  <!-- Barra de Navegación Inferior (3 Pestañas) -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="icon">❤️</span>
      <span>Toque</span>
    </a>
    <a href="pizarra.html" class="nav-item">
      <span class="icon">🎨</span>
      <span>Pizarra</span>
    </a>
    <a href="perfil.html" class="nav-item active">
      <span class="icon">👤</span>
      <span>Perfil</span>
    </a>
  </nav>

  <script>
    const SUPABASE_URL = 'https://qxoaavedwbomrhszvgtx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b2FhdmVkd2JvbXJoc3p2Z3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMjY2NDksImV4cCI6MjEwNjcwMjY0OX0.XtQDxQchFLNB4ywhHKHvoR4aqOEyMVmoc1tBeQ1KHR8';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentOwner = localStorage.getItem('device_owner') || 'Jeremmy';

    // 1. Cálculo del Aniversario: 25 de junio de 2024
    const startDate = new Date('2024-06-25T00:00:00');

    function calculateAnniversary() {
      const now = new Date();
      const diffTime = Math.abs(now - startDate);
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

      // Años y meses transcurridos
      let years = now.getFullYear() - startDate.getFullYear();
      let months = now.getMonth() - startDate.getMonth();
      let days = now.getDate() - startDate.getDate();

      if (days < 0) {
        months -= 1;
        const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }

      document.getElementById('days-together-stat').innerText = `${diffDays}`;
      document.getElementById('anniversary-counter').innerText = `${diffDays} días juntos`;
      document.getElementById('anniversary-sub').innerText = `${years} años, ${months} meses y ${days} días`;

      // Días restantes para el próximo 25 de junio
      let nextAnniv = new Date(now.getFullYear(), 5, 25); // Junio es mes 5 en JavaScript (0-index)
      if (now > nextAnniv) {
        nextAnniv = new Date(now.getFullYear() + 1, 5, 25);
      }
      const daysToNext = Math.ceil((nextAnniv - now) / (1000 * 60 * 60 * 24));
      document.getElementById('next-aniv-days').innerText = `${daysToNext}d`;
    }

    calculateAnniversary();

    // 2. Cargar toques totales acumulados desde Supabase
    async function loadStats() {
      const { count } = await supabaseClient
        .from('pings')
        .select('*', { count: 'exact', head: true });

      if (count !== null) {
        document.getElementById('total-touches-stat').innerText = count;
      }
    }
    loadStats();

    // 3. Guardar estado de ánimo
    function setMood(emoji, btn) {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      localStorage.setItem('my_mood', emoji);

      // Notificación rápida a Supabase
      supabaseClient.from('pings').insert([{ 
        sender: currentOwner, 
        created_at: new Date().toISOString() 
      }]);
    }

    const savedMood = localStorage.getItem('my_mood');
    if (savedMood) {
      document.querySelectorAll('.mood-btn').forEach(b => {
        if (b.innerText === savedMood) b.classList.add('active');
      });
    }
  </script>
</body>
</html>
