<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Perfil - Nosotros</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #070a13;
      --card-bg: rgba(19, 27, 46, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #f43f5e;
      --accent-soft: rgba(244, 63, 94, 0.15);
      --accent-glow: rgba(244, 63, 94, 0.45);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100%;
    }
    body {
      background-image: 
        radial-gradient(at 0% 0%, rgba(244, 63, 94, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 40px) 16px calc(env(safe-area-inset-bottom, 20px) + 85px) 16px;
      text-align: center;
      overflow-y: auto;
    }

    /* Cabecera de Pareja y Estados en Vivo */
    .couple-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 10px 0 16px;
    }
    .user-profile {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .avatar-wrapper {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      padding: 2px;
      background: #090d16;
      overflow: hidden;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #e2e8f0;
    }
    .mood-pill-status {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 3px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .mood-emoji-big { font-size: 1.1rem; }
    .mood-text-status {
      font-size: 0.7rem;
      color: #fda4af;
      font-weight: 600;
    }

    /* Banner Aniversario */
    .anniversary-banner {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.18), rgba(99, 102, 241, 0.18));
      border: 1px solid rgba(244, 63, 94, 0.35);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }
    .banner-title {
      font-size: 0.75rem;
      color: #fda4af;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .banner-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: white;
      margin-top: 2px;
    }
    .banner-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 3 Métricas Claras */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 16px;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(10px);
    }
    .metric-icon { font-size: 1.45rem; }
    .metric-title {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 500;
      line-height: 1.1;
    }
    .metric-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Selector de Ánimo */
    .mood-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
      text-align: left;
    }
    .mood-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: block;
    }
    .mood-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .mood-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 6px;
      font-size: 1.25rem;
      cursor: pointer;
      flex: 1;
      transition: all 0.2s ease;
    }
    .mood-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      transform: scale(1.08);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Barra Inferior Fija de 3 Pestañas */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom, 5px);
      z-index: 100;
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.72rem;
      text-decoration: none;
      width: 33.3%;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item span.icon { font-size: 1.3rem; }
  </style>
</head>
<body>

  <div class="couple-header">
    <div class="user-profile">
      <div class="avatar-wrapper">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Jeremmy" class="avatar-img" alt="Jeremmy">
      </div>
      <span class="user-name">Jeremmy</span>
      <div class="mood-pill-status">
        <span class="mood-emoji-big" id="mood-jeremmy">🥰</span>
        <span class="mood-text-status" id="text-mood-jeremmy">Enamorado</span>
      </div>
    </div>

    <div style="font-size: 1.3rem;">☁️️❤️☁️</div>

    <div class="user-profile">
      <div class="avatar-wrapper">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Veronica" class="avatar-img" alt="Вероничка">
      </div>
      <span class="user-name">Вероничка</span>
      <div class="mood-pill-status">
        <span class="mood-emoji-big" id="mood-veronica">🥰</span>
        <span class="mood-text-status" id="text-mood-veronica">Enamorada</span>
      </div>
    </div>
  </div>

  <div class="anniversary-banner">
    <div>
      <span class="banner-title">Juntos desde el 25 de junio</span>
      <div class="banner-text" id="anniversary-counter">Cargando...</div>
      <div class="banner-sub" id="anniversary-sub">Iniciamos en 2024</div>
    </div>
    <div style="font-size: 2.2rem;">💍</div>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <span class="metric-icon">💞</span>
      <span class="metric-title">Juntos Desde</span>
      <span class="metric-value" id="days-together-stat">0</span>
    </div>

    <div class="metric-card">
      <span class="metric-icon">💋</span>
      <span class="metric-title">Toques Totales</span>
      <span class="metric-value" id="total-touches-stat">0</span>
    </div>

    <div class="metric-card">
      <span class="metric-icon">🔥</span>
      <span class="metric-title">Racha Amor</span>
      <span class="metric-value" id="streak-stat">0d</span>
    </div>
  </div>

  <div class="mood-card">
    <span class="mood-label">Tu estado actual (se actualiza al instante en su pantalla):</span>
    <div class="mood-row">
      <button class="mood-btn" onclick="updateMyMood('🥰', this)">🥰</button>
      <button class="mood-btn" onclick="updateMyMood('🥺', this)">🥺</button>
      <button class="mood-btn" onclick="updateMyMood('😴', this)">😴</button>
      <button class="mood-btn" onclick="updateMyMood('✨', this)">✨</button>
      <button class="mood-btn" onclick="updateMyMood('🫂', this)">🫂</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="icon">❤️</span>
      <span>Toque</span>
    </a>
    <a href="pizarra.html" class="nav-item">
      <span class="icon">🎨</span>
      <span>Pizarra</span>
    </a>
    <a href="perfil.html" class="nav-item active">
      <span class="icon">👤</span>
      <span>Perfil</span>
    </a>
  </nav>

  <script>
    const SUPABASE_URL = 'https://qxoaavedwbomrhszvgtx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b2FhdmVkd2JvbXJoc3p2Z3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMjY2NDksImV4cCI6MjEwNjcwMjY0OX0.XtQDxQchFLNB4ywhHKHvoR4aqOEyMVmoc1tBeQ1KHR8';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentOwner = localStorage.getItem('device_owner') || 'Jeremmy';
    const startDate = new Date('2024-06-25T00:00:00');

    function calculateAnniversary() {
      const now = new Date();
      const diffDays = Math.floor(Math.abs(now - startDate) / (1000 * 60 * 60 * 24));

      let years = now.getFullYear() - startDate.getFullYear();
      let months = now.getMonth() - startDate.getMonth();
      let days = now.getDate() - startDate.getDate();

      if (days < 0) {
        months -= 1;
        const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }

      document.getElementById('days-together-stat').innerText = `${diffDays}`;
      document.getElementById('anniversary-counter').innerText = `${diffDays} días juntos`;
      document.getElementById('anniversary-sub').innerText = `${years} años, ${months} meses y ${days} días`;
    }

    calculateAnniversary();

    async function loadStats() {
      const sevenDaysAgo = new Date();
      sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

      const { data: recentPings } = await supabaseClient
        .from('pings')
        .select('created_at, sender')
        .gte('created_at', sevenDaysAgo.toISOString())
        .order('created_at', { ascending: false });

      const { count: totalCount } = await supabaseClient
        .from('pings')
        .select('*', { count: 'exact', head: true });

      if (totalCount !== null) {
        document.getElementById('total-touches-stat').innerText = totalCount;
      }

      if (recentPings && recentPings.length > 0) {
        const activeDays = new Set(recentPings.map(p => p.created_at.split('T')[0]));
        document.getElementById('streak-stat').innerText = `${activeDays.size}d`;
      } else {
        document.getElementById('streak-stat').innerText = '0d';
      }
    }

    loadStats();

    const moodDescriptions = {
      '🥰': 'Enamorado/a',
      '🥺': 'Extrañándote',
      '😴': 'Con sueñito',
      '✨': 'Feliz y motivado',
      '🫂': 'Necesita abrazo'
    };

    function renderMood(user, emoji) {
      const isJeremmy = user.toLowerCase().includes('jeremmy');
      const targetEmojiElem = document.getElementById(isJeremmy ? 'mood-jeremmy' : 'mood-veronica');
      const targetTextElem = document.getElementById(isJeremmy ? 'text-mood-jeremmy' : 'text-mood-veronica');

      if (targetEmojiElem) targetEmojiElem.innerText = emoji || '🥰';
      if (targetTextElem) targetTextElem.innerText = moodDescriptions[emoji] || 'Normal';
    }

    async function fetchMoods() {
      const { data } = await supabaseClient.from('couple_status').select('*');
      if (data) {
        data.forEach(item => {
          renderMood(item.user_name, item.mood);
          if (item.user_name.toLowerCase() === currentOwner.toLowerCase()) {
            highlightButton(item.mood);
          }
        });
      }
    }

    function highlightButton(mood) {
      document.querySelectorAll('.mood-btn').forEach(b => {
        if (b.innerText === mood) b.classList.add('active');
        else b.classList.remove('active');
      });
    }

    async function updateMyMood(emoji, btn) {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      renderMood(currentOwner, emoji);

      const targetUser = currentOwner.toLowerCase().includes('jeremmy') ? 'Jeremmy' : 'Verónica';

      await supabaseClient.from('couple_status').upsert({
        user_name: targetUser,
        mood: emoji,
        last_active: new Date().toISOString()
      });
    }

    fetchMoods();

    supabaseClient.channel('mood-live-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'couple_status' }, (payload) => {
        if (payload.new) {
          renderMood(payload.new.user_name, payload.new.mood);
        }
      })
      .subscribe();
  </script>
</body>
</html>
