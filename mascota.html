<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mascota - Nosotros</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #070a13;
      --card-bg: rgba(19, 27, 46, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #f43f5e;
      --accent-soft: rgba(244, 63, 94, 0.15);
      --accent-glow: rgba(244, 63, 94, 0.45);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 40px) 18px calc(env(safe-area-inset-bottom, 15px) + 72px) 18px;
      text-align: center;
      position: relative;
    }

    /* Barra Superior */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 36px;
      flex-shrink: 0;
      margin-bottom: 8px;
    }
    .pet-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #fda4af;
    }

    /* Panel de Estadísticas de la Mascota */
    .stats-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .level-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .level-badge {
      background: var(--accent);
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
    }
    .bar-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .fill-hunger { background: linear-gradient(90deg, #f59e0b, #ef4444); }
    .fill-love { background: linear-gradient(90deg, #ec4899, #f43f5e); }
    .fill-xp { background: linear-gradient(90deg, #6366f1, #a855f7); }

    /* Habitación de la Mascota */
    .room-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at 50% 60%, rgba(244, 63, 94, 0.14) 0%, transparent 65%);
    }

    /* Gatito Ilustrado en CSS */
    .cat-wrapper {
      position: relative;
      cursor: pointer;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .cat-wrapper:active { transform: scale(0.92); }

    .cat-body {
      width: 110px;
      height: 95px;
      background: #f8fafc;
      border-radius: 50% 50% 45% 45%;
      position: relative;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Orejitas */
    .ear {
      position: absolute;
      top: -16px;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 24px solid #f8fafc;
    }
    .ear.left { left: 8px; transform: rotate(-18deg); }
    .ear.right { right: 8px; transform: rotate(18deg); }
    .ear-inner {
      position: absolute;
      top: 6px;
      left: -8px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 14px solid #fda4af;
    }

    /* Carita */
    .face {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eye {
      position: absolute;
      top: 36px;
      width: 10px;
      height: 12px;
      background: #1e293b;
      border-radius: 50%;
      animation: blink 4s infinite;
    }
    .eye.left { left: 28px; }
    .eye.right { right: 28px; }
    @keyframes blink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }

    .snout {
      position: absolute;
      top: 48px;
      width: 6px;
      height: 4px;
      background: #fb7185;
      border-radius: 40%;
    }
    .blush {
      position: absolute;
      top: 46px;
      width: 14px;
      height: 8px;
      background: rgba(244, 63, 94, 0.35);
      border-radius: 50%;
    }
    .blush.left { left: 16px; }
    .blush.right { right: 16px; }

    /* Animación de dormir */
    .sleeping .eye {
      height: 3px !important;
      border-radius: 0 0 10px 10px;
      transform: scaleY(1) !important;
      animation: none !important;
    }

    /* Burbuja de estado */
    .dialogue-bubble {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      margin-top: 14px;
      color: #e2e8f0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* Botones de Cuidado (Comer / Mimos) */
    .actions-grid {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .action-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 10px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .action-btn:active {
      transform: scale(0.93);
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .action-btn span.emoji { font-size: 1.6rem; }

    /* Barra Inferior (4 Pestañas) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom, 5px);
      z-index: 100;
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.68rem;
      text-decoration: none;
      width: 25%;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item span.icon { font-size: 1.25rem; }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <div class="top-bar">
    <div class="pet-badge">
      <span>🐾</span>
      <span id="pet-name-display">Mishi</span>
    </div>
    <span style="font-size: 0.75rem; color: #94a3b8;" id="last-action-text">Cargando...</span>
  </div>

  <!-- Panel de Métricas de Mascota -->
  <div class="stats-card">
    <div class="level-row">
      <span>Nivel conjunto</span>
      <span class="level-badge" id="pet-level">Nv. 1</span>
    </div>

    <!-- Barra de Hambre -->
    <div class="bar-container">
      <span>🍗</span>
      <div class="bar-bg">
        <div class="bar-fill fill-hunger" id="hunger-bar" style="width: 85%;"></div>
      </div>
      <span id="hunger-val" style="width: 32px;">85%</span>
    </div>

    <!-- Barra de Cariño -->
    <div class="bar-container">
      <span>💖</span>
      <div class="bar-bg">
        <div class="bar-fill fill-love" id="love-bar" style="width: 90%;"></div>
      </div>
      <span id="love-val" style="width: 32px;">90%</span>
    </div>

    <!-- Barra de XP -->
    <div class="bar-container">
      <span>✨</span>
      <div class="bar-bg">
        <div class="bar-fill fill-xp" id="xp-bar" style="width: 20%;"></div>
      </div>
      <span id="xp-val" style="width: 32px;">20/100</span>
    </div>
  </div>

  <!-- Habitación con el Gatito -->
  <div class="room-stage">
    <div class="cat-wrapper" id="cat" onclick="petCat()">
      <div class="cat-body">
        <div class="ear left"><div class="ear-inner"></div></div>
        <div class="ear right"><div class="ear-inner"></div></div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="blush left"></div>
          <div class="blush right"></div>
          <div class="snout"></div>
        </div>
      </div>
    </div>
    <div class="dialogue-bubble" id="cat-dialogue">¡Miau! Tócame para hacerme mimos.</div>
  </div>

  <!-- Acciones Compartidas -->
  <div class="actions-grid">
    <button class="action-btn" onclick="feedCat('🐟', 15)">
      <span class="emoji">🐟</span>
      <span>Dar Pescado</span>
    </button>
    <button class="action-btn" onclick="feedCat('🥛', 10)">
      <span class="emoji">🥛</span>
      <span>Dar Leche</span>
    </button>
    <button class="action-btn" onclick="petCat()">
      <span class="emoji">❤️</span>
      <span>Acariciar</span>
    </button>
  </div>

  <!-- Barra Inferior de 4 Pestañas -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="icon">❤️</span>
      <span>Toque</span>
    </a>
    <a href="pizarra.html" class="nav-item">
      <span class="icon">🎨</span>
      <span>Pizarra</span>
    </a>
    <a href="mascota.html" class="nav-item active">
      <span class="icon">🐾</span>
      <span>Mascota</span>
    </a>
    <a href="perfil.html" class="nav-item">
      <span class="icon">👤</span>
      <span>Perfil</span>
    </a>
  </nav>

  <script>
    const SUPABASE_URL = 'https://qxoaavedwbomrhszvgtx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b2FhdmVkd2JvbXJoc3p2Z3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMjY2NDksImV4cCI6MjEwNjcwMjY0OX0.XtQDxQchFLNB4ywhHKHvoR4aqOEyMVmoc1tBeQ1KHR8';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentOwner = localStorage.getItem('device_owner') || 'Jeremmy';
    let petData = { level: 1, xp: 20, hunger: 85, affection: 90, name: 'Mishi' };

    // 1. Cargar Estado de la Mascota
    async function loadPet() {
      const { data, error } = await supabaseClient.from('pet_state').select('*').eq('id', 1).single();
      if (data) {
        petData = data;
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('pet-name-display').innerText = petData.name || 'Mishi';
      document.getElementById('pet-level').innerText = `Nv. ${petData.level}`;

      document.getElementById('hunger-bar').style.width = `${petData.hunger}%`;
      document.getElementById('hunger-val').innerText = `${petData.hunger}%`;

      document.getElementById('love-bar').style.width = `${petData.affection}%`;
      document.getElementById('love-val').innerText = `${petData.affection}%`;

      document.getElementById('xp-bar').style.width = `${petData.xp % 100}%`;
      document.getElementById('xp-val').innerText = `${petData.xp % 100}/100`;

      if (petData.last_action_by) {
        document.getElementById('last-action-text').innerText = `Cuidado por: ${petData.last_action_by}`;
      }

      // Animación si está hambriento o durmiendo
      const catElem = document.getElementById('cat');
      if (petData.hunger < 25) {
        document.getElementById('cat-dialogue').innerText = '😿 ¡Tengo mucha hambre!';
      } else if (petData.status === 'durmiendo') {
        catElem.classList.add('sleeping');
        document.getElementById('cat-dialogue').innerText = '💤 Zzz... durmiendo calentito.';
      } else {
        catElem.classList.remove('sleeping');
      }
    }

    // 2. Dar de comer (Pescado / Leche)
    async function feedCat(foodEmoji, hungerGain) {
      if ('vibrate' in navigator) navigator.vibrate(60);

      const dialogue = document.getElementById('cat-dialogue');
      dialogue.innerText = `¡Ñam ñam! ${currentOwner} le dio ${foodEmoji}`;

      // Aumentar estadísticas
      petData.hunger = Math.min(100, petData.hunger + hungerGain);
      petData.xp += 10;
      if (petData.xp >= petData.level * 100) {
        petData.level += 1;
        dialogue.innerText = `🎉 ¡${petData.name} subió al Nivel ${petData.level}!`;
      }
      petData.last_action_by = currentOwner;
      petData.status = 'feliz';

      updateUI();

      // Guardar en Supabase para que se sincronice en el otro celular
      await supabaseClient.from('pet_state').update({
        hunger: petData.hunger,
        xp: petData.xp,
        level: petData.level,
        last_action_by: currentOwner,
        last_fed_at: new Date().toISOString(),
        status: 'feliz'
      }).eq('id', 1);
    }

    // 3. Acariciar al gato
    async function petCat() {
      if ('vibrate' in navigator) navigator.vibrate([40, 60, 40]);

      const dialogue = document.getElementById('cat-dialogue');
      dialogue.innerText = `Purrr... ❤️ ${currentOwner} lo está acariciando.`;

      petData.affection = Math.min(100, petData.affection + 8);
      petData.xp += 5;
      if (petData.xp >= petData.level * 100) {
        petData.level += 1;
      }
      petData.last_action_by = currentOwner;
      updateUI();

      await supabaseClient.from('pet_state').update({
        affection: petData.affection,
        xp: petData.xp,
        level: petData.level,
        last_action_by: currentOwner,
        last_petted_at: new Date().toISOString()
      }).eq('id', 1);
    }

    // 4. Sincronización en tiempo real vía WebSockets
    supabaseClient.channel('pet-live-channel')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pet_state' }, (payload) => {
        if (payload.new) {
          petData = payload.new;
          updateUI();
          if (payload.new.last_action_by !== currentOwner) {
            document.getElementById('cat-dialogue').innerText = `✨ ${payload.new.last_action_by} acaba de cuidar a ${petData.name}`;
          }
        }
      })
      .subscribe();

    loadPet();
  </script>
</body>
</html>
